apiVersion: 1
groups:
  - orgId: 1
    name: switchback-local
    folder: Switchback Local
    interval: 1m
    rules:
      - uid: sb-backend-down
        title: Backend target down
        condition: B
        for: 2m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        annotations:
          summary: "Scrape reachability only; inspect Backend independently of telemetry."
        labels:
          service: switchback-backend
          environment: local
        data:
          - refId: A
            datasourceUid: switchback-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {"refId":"A","expr":"1 - (min(up{job=\"switchback-backend\"}) or vector(0))","instant":true,"range":false,"intervalMs":15000,"maxDataPoints":43200,"datasource":{"type":"prometheus","uid":"switchback-prometheus"}}
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {"refId":"B","type":"threshold","expression":"A","conditions":[{"type":"query","query":{"params":["B"]},"reducer":{"type":"last","params":[]},"evaluator":{"type":"gt","params":[0]},"operator":{"type":"and"}}],"datasource":{"type":"__expr__","uid":"__expr__"}}
      - uid: sb-log-drops
        title: Telemetry records dropped
        condition: B
        for: 1m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        annotations:
          summary: "Best-effort loss; receiver acceptance does not prove Loki persistence. Counters reset on restart."
        labels:
          service: switchback-backend
          environment: local
        data:
          - refId: A
            datasourceUid: switchback-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {"refId":"A","expr":"(sum(increase(switchback_telemetry_dropped_total[5m])) + sum(increase(loki_write_dropped_entries_total[5m]))) and on() (up{job=\"switchback-backend\"} == 1) and on() (up{job=\"alloy\"} == 1) and on() switchback_telemetry_dropped_total and on() loki_write_dropped_entries_total","instant":true,"range":false,"intervalMs":15000,"maxDataPoints":43200,"datasource":{"type":"prometheus","uid":"switchback-prometheus"}}
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {"refId":"B","type":"threshold","expression":"A","conditions":[{"type":"query","query":{"params":["B"]},"reducer":{"type":"last","params":[]},"evaluator":{"type":"gt","params":[0]},"operator":{"type":"and"}}],"datasource":{"type":"__expr__","uid":"__expr__"}}
      - uid: sb-sample-stale
        title: Authority sample stale or unavailable
        condition: B
        for: 2m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        annotations:
          summary: "Retained values can be stale; target up does not prove authority readable."
        labels:
          service: switchback-backend
          environment: local
        data:
          - refId: A
            datasourceUid: switchback-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {"refId":"A","expr":"max(1 - switchback_telemetry_sample_available) + max(1 - switchback_telemetry_sample_current) + (max((time() - switchback_telemetry_sample_last_success_timestamp_seconds) > bool 60) or vector(0))","instant":true,"range":false,"intervalMs":15000,"maxDataPoints":43200,"datasource":{"type":"prometheus","uid":"switchback-prometheus"}}
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {"refId":"B","type":"threshold","expression":"A","conditions":[{"type":"query","query":{"params":["B"]},"reducer":{"type":"last","params":[]},"evaluator":{"type":"gt","params":[0]},"operator":{"type":"and"}}],"datasource":{"type":"__expr__","uid":"__expr__"}}
      - uid: sb-projection-backlog
        title: Projection backlog sustained
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        annotations:
          summary: "Oldest pending age above five minutes; empty pending set legitimately has no age series."
        labels:
          service: switchback-backend
          environment: local
        data:
          - refId: A
            datasourceUid: switchback-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {"refId":"A","expr":"((max(switchback_candidate_oldest_pending_age_seconds > bool 300) or vector(0)) + (max(switchback_fragment_oldest_pending_age_seconds > bool 300) or vector(0))) and on() (switchback_telemetry_sample_available == 1) and on() (switchback_telemetry_sample_current == 1) and on() ((time() - switchback_telemetry_sample_last_success_timestamp_seconds) <= 60)","instant":true,"range":false,"intervalMs":15000,"maxDataPoints":43200,"datasource":{"type":"prometheus","uid":"switchback-prometheus"}}
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {"refId":"B","type":"threshold","expression":"A","conditions":[{"type":"query","query":{"params":["B"]},"reducer":{"type":"last","params":[]},"evaluator":{"type":"gt","params":[0]},"operator":{"type":"and"}}],"datasource":{"type":"__expr__","uid":"__expr__"}}
      - uid: sb-runtime-attention
        title: Runtime or session needs inspection
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        isPaused: false
        annotations:
          summary: "Current lost Sessions and suspect/unhealthy Runtime rows require inspection. Historical lost/terminated Runtime rows are excluded; this is not a live health probe."
        labels:
          service: switchback-backend
          environment: local
        data:
          - refId: A
            datasourceUid: switchback-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {"refId":"A","expr":"((sum(switchback_session_state{status=\"lost\"}) or vector(0)) + (sum(switchback_runtime_state{status=~\"suspect|unhealthy\"}) or vector(0))) and on() (switchback_telemetry_sample_available == 1) and on() (switchback_telemetry_sample_current == 1) and on() ((time() - switchback_telemetry_sample_last_success_timestamp_seconds) <= 60)","instant":true,"range":false,"intervalMs":15000,"maxDataPoints":43200,"datasource":{"type":"prometheus","uid":"switchback-prometheus"}}
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {"refId":"B","type":"threshold","expression":"A","conditions":[{"type":"query","query":{"params":["B"]},"reducer":{"type":"last","params":[]},"evaluator":{"type":"gt","params":[0]},"operator":{"type":"and"}}],"datasource":{"type":"__expr__","uid":"__expr__"}}
# Grafana 13.2.2 creates the built-in "empty" receiver with no integrations.
# Keep evaluation visible locally without external notification or remediation.
policies:
  - orgId: 1
    receiver: empty
    group_by: [grafana_folder, alertname]
